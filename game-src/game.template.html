function uniqueRecords(list){const seen=new Set();return (Array.isArray(list)?list:[]).slice(0,80).map(limitedRecord).filter(r=>{if(!r||seen.has(r.id))return false;seen.add(r.id);return true;});}
function normalizeLimited(raw,students=[],migrate=true){
 const out=blankLimited();
 if(!raw||raw.version!==1){
  const existing=students.filter(s=>s.points>=20||s.badges?.includes('hero')).map(s=>({id:s.id,name:s.name,time:0}));
  if(migrate&&existing.length)out.pending={token:'existing-class',mode:'legacy',candidates:existing,slots:Math.min(5,existing.length)};
  return out;
 }
 out.qualifiers=uniqueRecords(raw.qualifiers).slice(0,5);const known=new Set(out.qualifiers.map(r=>r.id));
 if(raw.pending&&out.qualifiers.length<5){const candidates=uniqueRecords(raw.pending.candidates).filter(r=>!known.has(r.id));if(candidates.length){out.pending={token:typeof raw.pending.token==='string'?raw.pending.token.slice(0,100):'pending',mode:raw.pending.mode==='legacy'?'legacy':'tie',candidates,slots:Math.min(5-out.qualifiers.length,candidates.length,Math.max(1,safeInt(raw.pending.slots)))};for(const r of candidates)known.add(r.id);}}
 out.queue=(Array.isArray(raw.queue)?raw.queue:[]).slice(0,80).map(batch=>uniqueRecords(batch).filter(r=>{if(known.has(r.id))return false;known.add(r.id);return true;})).filter(b=>b.length);
 const owners=new Set();for(const key of LIMITED_KEYS){const r=limitedRecord(raw.claims?.[key]);if(r&&out.qualifiers.some(q=>q.id===r.id)&&!owners.has(r.id)){out.claims[key]=r;owners.add(r.id);}}
 return out;
}
function limitedState(){return state.game.limited;}
function cloneLimited(){return JSON.parse(JSON.stringify(limitedState()));}
function restoreLimitedUndo(snapshot){
 state.game.limited=releaseOrphanedLimited(normalizeLimited(snapshot,[],false),state.students);
}
function limitedOwner(key){return limitedState()?.claims[key]||null;}
function ownedLimited(id){return LIMITED_KEYS.find(key=>limitedOwner(key)?.id===id)||null;}
function isLimitedQualifier(id){return limitedState()?.qualifiers.some(q=>q.id===id)||false;}
function displayLimitedName(record){return state.students.find(s=>s.id===record.id)?.name||record.name;}
function processLimitedQueue(){
 const pool=limitedState();if(pool.pending)return;
 while(pool.qualifiers.length<5&&pool.queue.length){const batch=pool.queue.shift().filter(r=>!pool.qualifiers.some(q=>q.id===r.id));if(!batch.length)continue;const slots=5-pool.qualifiers.length;
  if(batch.length<=slots)pool.qualifiers.push(...batch);
  else {pool.pending={token:'tie-'+uid(),mode:'tie',candidates:batch,slots};break;}
 }
 if(pool.qualifiers.length===5){pool.pending=null;pool.queue=[];}
}
function registerLimitedMilestones(changes){
 const pool=limitedState(),known=new Set([...pool.qualifiers,...(pool.pending?.candidates||[]),...pool.queue.flat()].map(r=>r.id));
 if(pool.qualifiers.length>=5)return [];
 const gained=changes.filter(c=>c.before<20&&c.after>=20&&!known.has(c.id)).map(c=>{const s=state.students.find(s=>s.id===c.id);return {id:c.id,name:s?.name||'Student',time:Date.now()};});
 if(gained.length)pool.queue.push(gained);processLimitedQueue();return gained;
}
function canUseLimited(s,key){return LIMITED_KEYS.includes(key)&&limitedOwner(key)?.id===s.id;}
function claimLimitedFish(id,key){
 const s=state.students.find(s=>s.id===id),pool=limitedState();if(!s||!LIMITED_KEYS.includes(key))return;
 if(limitedOwner(key)?.id===id){chooseFishStyle(id,'form',key);return;}
 if(!heroClaimEligible(s,key)){toast(pool.returned?.includes(key)?'Reach 20 points to claim this returned hero. Resolve pending hero tickets first.':'The first five students to reach 20 points earn a limited claim.');return;}
 if(ownedLimited(id)){toast('Each student can claim one Avengers fish. Your first choice stays reserved for you.');return;}
 if(limitedOwner(key)){toast('This 1/1 fish has already been claimed. Choose an available hero.');return;}
 const beforeMeta=captureMeta(s),reefBefore=JSON.parse(JSON.stringify(state.game.reef)),limitedBefore=cloneLimited();
 if(!isLimitedQualifier(id))pool.qualifiers.push({id:s.id,name:s.name,time:Date.now()});pool.returned=(pool.returned||[]).filter(k=>k!==key);
 pool.claims[key]={id:s.id,name:s.name,time:Date.now()};s.form=key;s.skin='natural';s.hero='none';
 finishGameChange(s.name+': claimed '+FORMS[key].name,[{id,before:s.points,after:s.points,beforeMeta,afterMeta:captureMeta(s)}],reefBefore,limitedBefore);
 const w=swimmers.get(s.id);if(w)emit(w.x,w.y,FORMS[key].glow,36);
 lookTab='limited';openGameDialog('styles',s.id);showCelebration(FORMS[key].name+' · 1/1',s.name+' owns this hero and its signature trail.','✦');playSound(true);toast('Limited fish claimed · autosaved.',true);

let limitedPicks=new Set(),limitedPickToken='';
function confirmLimitedPicks(){
 const pool=limitedState(),p=pool.pending;if(!p)return;const records=p.candidates.filter(r=>limitedPicks.has(r.id));
 if(records.length!==p.slots){dialogError('Select exactly '+p.slots+' student'+(p.slots===1?'':'s')+'.');return;}
 const before=cloneLimited();pool.qualifiers.push(...records);pool.pending=null;processLimitedQueue();
 finishGameChange('Confirmed limited hero qualifiers',[],JSON.parse(JSON.stringify(state.game.reef)),before);limitedPicks.clear();limitedPickToken='';
 if(pool.pending)openGameDialog('limitedSetup');else {lookTab='limited';openGameDialog('styles',selectedId);toast('Hero tickets saved. Each qualifier may claim one available fish.',true);}

function effectiveSkin(s){return SKINS[s.skin]&&s.points>=SKINS[s.skin].at?s.skin:'natural';}
function baseFamily(s){return FORMS[effectiveForm(s)]?.family??s.family;}
function fishVisualPalette(s){const skin=SKINS[effectiveSkin(s)];return skin.glow?skin:FORMS[effectiveForm(s)].glow?{...PALETTES[s.color],glow:FORMS[effectiveForm(s)].glow}:PALETTES[s.color];}
function cosmeticCatalog(){return [...Object.entries(FORMS).filter(([k,f])=>k!=='normal'&&!f.limited).map(([key,f])=>({type:'form',key,...f})),...Object.entries(SKINS).filter(([k])=>k!=='natural').map(([key,f])=>({type:'skin',key,...f})),...Object.entries(HEROES).filter(([k])=>k!=='none').map(([key,name])=>({type:'hero',key,name,at:20}))];}
function collectionProgress(s){const items=cosmeticCatalog(),available=items.filter(f=>s.points>=f.at),nextAt=Math.min(...items.filter(f=>f.at>s.points).map(f=>f.at));return {total:items.length,available:available.length,next:Number.isFinite(nextAt)?{at:nextAt,items:items.filter(f=>f.at===nextAt)}:null};}
function nextLookText(s){const p=collectionProgress(s);return p.next?`${p.next.at-s.points} pts to ${p.next.items[0].name}${p.next.items.length>1?' + more':''}`:'All looks unlocked · keep growing!';}
function chooseFishStyle(studentId,type,value){
 const catalog=type==='skin'?SKINS:type==='form'?FORMS:type==='hero'?HEROES:null;
 if(!catalog||!Object.hasOwn(catalog,value))return;
 const s=state.students.find(s=>s.id===studentId);if(!s)return;ensureStudent(s);
 const limited=type==='form'&&catalog[value].limited;if(limited&&!canUseLimited(s,value)){lookTab='limited';openGameDialog('styles',s.id);toast('Only the owner may equip this 1/1 fish.');return;}
 const threshold=limited?0:type==='hero'?(value==='none'?0:20):catalog[value].at;
 if(s.points<threshold){toast(`${threshold} points unlocks this style.`);return;}
 if(s[type]===value&&!(type==='form'&&catalog[value].bundle&&(s.hero!=='none'||s.skin!=='natural'))){openGameDialog('styles',s.id);return;}
 const beforeMeta=captureMeta(s),reefBefore=JSON.parse(JSON.stringify(state.game.reef));s[type]=value;if(type==='form'&&catalog[value].bundle){s.hero='none';s.skin='natural';}
 const name=type==='hero'?HEROES[value]:catalog[value].name;
 finishGameChange(`${s.name}: ${name}`,[{id:s.id,before:s.points,after:s.points,beforeMeta,afterMeta:captureMeta(s)}],reefBefore);
 const w=swimmers.get(s.id);if(w)emit(w.x,w.y,fishVisualPalette(s).glow,18);
 openGameDialog('styles',s.id);toast(name+' equipped · saved.',true);
}

const EVOLUTION_NAMES=[['Little fry','Reef explorer','Coral glow','Sunfire','Royal flame','Reef giant','Ocean guardian','Ocean titan'],['Little fry','Sail fins','Electric glow','Aurora','Royal tide','Tidal giant','Storm guardian','Ocean titan'],['Little fry','Ribbon fins','Moon glow','Stardust','Royal pearl','Pearl giant','Moon guardian','Ocean titan']];
const SHOP_ITEMS=[{id:'pearls',name:'Pearl halo',cost:10,icon:'◌',scope:'fish',detail:'A circle of luminous pearls.'},{id:'startrail',name:'Rainbow trail',cost:15,icon:'✦',scope:'fish',detail:'Extra rainbow sparkles. Activates at 20 points.'},{id:'flower',name:'Flower crown',cost:20,icon:'✿',scope:'fish',detail:'A little underwater flower crown.'},{id:'grass',name:'Sea garden',cost:15,icon:'❧',scope:'class',detail:'Waving plants for the class aquarium.'},{id:'shells',name:'Pearl shells',cost:20,icon:'◡',scope:'class',detail:'A cluster of glowing seabed shells.'},{id:'chest',name:'Treasure chest',cost:40,icon:'▣',scope:'class',detail:'A chest of shining gold on the seabed.'}];

const BADGES=[{id:'reading',name:'Reading Star',icon:'★',detail:'Earn 5 reading rewards.'},{id:'kindness',name:'Kindness Helper',icon:'♥',detail:'Earn 3 kindness rewards.'},{id:'team',name:'Team Player',icon:'⚑',detail:'Join 5 whole-class rewards.'},{id:'growth',name:'Growing Strong',icon:'❧',detail:'Reach 25 points.'},{id:'hero',name:'Hero Ready',icon:'✧',detail:'Reach 20 points and unlock hero masks and a shark.'},{id:'giant',name:'Ocean Giant',icon:'♛',detail:'Reach 200 points.'},{id:'improved',name:'Most Improved',icon:'↗',detail:'Awarded by the teacher for personal progress.'}];

const defaultsMissions=()=>[{id:'read-words',title:'Read five words',points:3,category:'reading'},{id:'short-story',title:'Read a short story',points:5,category:'reading'},{id:'help-friend',title:'Help a classmate',points:2,category:'kindness'}];

const safeInt=(v,max=99999)=>clamp(Math.floor(Number(v)||0),0,max);
const localDay=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function studentMeta(raw={},points=0){
 const stats=raw.stats&&typeof raw.stats==='object'?raw.stats:{};const completed={};
 if(raw.completed&&typeof raw.completed==='object')for(const [k,v] of Object.entries(raw.completed).slice(-40))if(/^[\w-]{1,80}$/.test(k)&&/^\d{4}-\d{2}-\d{2}$/.test(v))completed[k]=v;
 return {shells:raw.shells===undefined?safeInt(points):safeInt(raw.shells),owned:Array.isArray(raw.owned)?[...new Set(raw.owned.filter(id=>SHOP_ITEMS.some(i=>i.scope==='fish'&&i.id===id)))]:[],equipped:SHOP_ITEMS.some(i=>i.scope==='fish'&&i.id===raw.equipped)?raw.equipped:'none',hero:Object.hasOwn(HEROES,raw.hero)?raw.hero:'none',form:Object.hasOwn(FORMS,raw.form)?raw.form:'normal',skin:Object.hasOwn(SKINS,raw.skin)?raw.skin:'natural',badges:Array.isArray(raw.badges)?[...new Set(raw.badges.filter(id=>BADGES.some(b=>b.id===id)))]:[],stats:{reading:safeInt(stats.reading),kindness:safeInt(stats.kindness),team:safeInt(stats.team),work:safeInt(stats.work),earned:stats.earned===undefined?safeInt(points):safeInt(stats.earned,999999)},completed};
}
function reefMeta(raw={}){return {owned:Array.isArray(raw.owned)?[...new Set(raw.owned.filter(id=>DECOR_IDS.includes(id)))]:[],active:Array.isArray(raw.active)?[...new Set(raw.active.filter(id=>DECOR_IDS.includes(id)))]:[],goals:Array.isArray(raw.goals)?[...new Set(raw.goals.filter(id=>CLASS_GOALS.some(g=>g.id===id)))]:[]};}
function initGameState(core,raw=core){
 const g=raw.game&&typeof raw.game==='object'?raw.game:{};
 core.savedAt=safeInt(raw.savedAt,Number.MAX_SAFE_INTEGER);core.revision=safeInt(raw.revision,Number.MAX_SAFE_INTEGER);
 core.students.forEach((s,i)=>Object.assign(s,studentMeta(raw.students?.[i]||s,s.points)));
 const missionList=Array.isArray(g.missions)?g.missions.slice(0,3).filter(m=>m&&typeof m.title==='string'&&m.title.trim()):defaultsMissions();
 const shortcutList=Array.isArray(g.shortcuts)?g.shortcuts.slice(0,3).filter(m=>m&&typeof m.label==='string'&&m.label.trim()):defaultsShortcuts();
 core.game={reef:reefMeta(g.reef),missions:missionList.map((m,i)=>({id:/^[\w-]{1,80}$/.test(m.id||'')?m.id:'mission-'+i,title:m.title.trim().slice(0,70),points:clamp(safeInt(m.points),1,50),category:['reading','kindness','work'].includes(m.category)?m.category:'work'})),shortcuts:shortcutList.map(m=>({label:m.label.trim().slice(0,24),points:clamp(safeInt(m.points),1,50),category:['reading','kindness','work'].includes(m.category)?m.category:'work'}))};
 core.game.limited=normalizeLimited(g.limited,core.students);
 while(core.game.missions.length<3)core.game.missions.push(defaultsMissions()[core.game.missions.length]);
 while(core.game.shortcuts.length<3)core.game.shortcuts.push(defaultsShortcuts()[core.game.shortcuts.length]);
 const seen=new Set();core.game.missions.forEach((m,i)=>{if(seen.has(m.id))m.id='mission-'+i;seen.add(m.id);});
 core.students.forEach(checkBadges);const total=core.students.reduce((a,s)=>a+s.points,0);for(const goal of CLASS_GOALS)if(total>=goal.at&&!core.game.reef.goals.includes(goal.id)){core.game.reef.goals.push(goal.id);if(!core.game.reef.owned.includes(goal.id))core.game.reef.owned.push(goal.id);if(!core.game.reef.active.includes(goal.id))core.game.reef.active.push(goal.id);}
 return core;
}
function ensureStudent(s){if(s.shells===undefined)Object.assign(s,studentMeta(s,s.points));if(!Object.hasOwn(SKINS,s.skin))s.skin='natural';return s;}
function validateState(raw){return initGameState(validateCoreState(raw),raw);}
function demoState(){return initGameState(demoCoreState());}
function effectiveForm(s){const f=FORMS[s.form];if(!f)return 'normal';if(s._showcase===true)return s.form;if(f.limited)return canUseLimited(s,s.form)?s.form:'normal';return s.points>=f.at?s.form:'normal';}
function effectiveHero(s){return s.points>=20&&Object.hasOwn(HEROES,s.hero)?s.hero:'none';}
function evolutionName(s,index=stageIndex(s.points)){return EVOLUTION_NAMES[baseFamily(s)][Math.min(index,7)];}
function fishTypeName(s){return effectiveForm(s)==='normal'?FAMILIES[s.family].name:FORMS[effectiveForm(s)].name;}
function classTotal(){return state.students.reduce((a,s)=>a+s.points,0);}
function checkBadges(s){const rules={reading:s.stats.reading>=5,kindness:s.stats.kindness>=3,team:s.stats.team>=5,growth:s.points>=25,hero:s.points>=20,giant:s.points>=200};const gained=[];for(const [id,yes] of Object.entries(rules))if(yes&&!s.badges.includes(id)){s.badges.push(id);gained.push(id);}return gained;}
function updateClassGoals(){const total=classTotal(),unlocked=[];for(const g of CLASS_GOALS)if(total>=g.at&&!state.game.reef.goals.includes(g.id)){state.game.reef.goals.push(g.id);if(!state.game.reef.owned.includes(g.id))state.game.reef.owned.push(g.id);if(!state.game.reef.active.includes(g.id))state.game.reef.active.push(g.id);unlocked.push(g);}return unlocked;}
function captureMeta(s){return JSON.parse(JSON.stringify(studentMeta(s,s.points)));}
function addHistory(label,changes,reefBefore,limitedBefore){state.history.push({label,changes,time:Date.now(),reefBefore,limitedBefore});state.history=state.history.slice(-50);}
function finishGameChange(label,changes,reefBefore,limitedBefore){addHistory(label,changes,reefBefore,limitedBefore);save();render();}
function reward(ids,amount,options={}){
 const changes=[],evolved=[],badgeGains=[],lookGains=[];const limitedBefore=cloneLimited(),reefBefore=JSON.parse(JSON.stringify(state.game.reef));
 for(const id of ids){const s=state.students.find(s=>s.id===id);if(!s)continue;ensureStudent(s);if(options.mission&&s.completed[options.mission]===localDay())continue;
  const before=s.points,beforeMeta=captureMeta(s);s.points=clamp(s.points+amount,-99999,99999);const actual=s.points-before;if(!actual)continue;
  s.shells=clamp(s.shells+actual,0,99999);if(actual>0){s.stats.earned=clamp(s.stats.earned+actual,0,999999);if(options.category&&Object.hasOwn(s.stats,options.category))s.stats[options.category]++;if(options.mission)s.completed[options.mission]=localDay();}
  const looks=cosmeticCatalog().filter(f=>f.at>before&&f.at<=s.points);if(looks.length)lookGains.push({s,looks});
  const badges=checkBadges(s);if(badges.length)badgeGains.push({name:s.name,ids:badges});
  changes.push({id,before,after:s.points,beforeMeta,afterMeta:captureMeta(s)});if(stageIndex(s.points)>stageIndex(before))evolved.push(s);
  const w=swimmers.get(id);if(w){w.pulse=1.8;if(actual>0)dropFood(s,w,actual);else{for(let i=foods.length-1;i>=0;i--)if(foods[i].owner===id)foods.splice(i,1);emit(w.x,w.y,PALETTES[s.color].glow,5);}floaters.push({x:w.x,y:w.y,text:(actual>0?'+':'')+actual,life:1.8,color:actual>0?'#d6ffdf':'#ffd9ca'});}
 }
 if(!changes.length)return false;const first=state.students.find(s=>s.id===changes[0].id),group=changes.length>1,label=options.label||(group?`${amount>0?'+':''}${amount} for ${changes.length} students`:`${first.name} ${amount>0?'+':''}${changes[0].after-changes[0].before}`),goals=updateClassGoals();
 registerLimitedMilestones(changes);finishGameChange(label,changes,reefBefore,limitedBefore);
 if(evolved.length===1)announceEvolution(evolved[0],stageIndex(evolved[0].points));else if(evolved.length>1)showCelebration(`${evolved.length} fish evolved!`,'Growing together.', '✧');
 if(goals.length)showCelebration('Class goal unlocked!',goals[goals.length-1].name,'⚓');
 else if(lookGains.length){const firstLook=lookGains[0];showCelebration(lookGains.length===1?firstLook.s.name+' unlocked new looks!':lookGains.length+' fish unlocked new looks!',firstLook.looks.slice(0,2).map(f=>f.name).join(' + ')+(firstLook.looks.length>2?' + more':'')+' · Open Styles','◈');}
 if(limitedState().qualifiers.length>limitedBefore.qualifiers.length)showCelebration('Limited hero ticket earned!',(limitedState().qualifiers.length-limitedBefore.qualifiers.length)+' new ticket(s) · Open Styles → Limited heroes','✦');
 else if(limitedState().pending?.token!==limitedBefore.pending?.token&&limitedState().pending)showCelebration('Hero tickets need your choice','Open Styles → Limited heroes to confirm the final arrivals.','✦');
 const message=group?`${changes.length} fish rewarded together.`:`${first.name}: ${first.points} points${amount>0?' · +'+(changes[0].after-changes[0].before)+' shells':''}${badgeGains.length?' · New badge!':''}`;toast(message,true);playSound(evolved.length>0||goals.length>0);return true;
}
function undo(){const h=state.history.pop();if(!h){toast('No change to undo yet.');return;}const ids=new Set(h.changes.map(c=>c.id));for(let i=foods.length-1;i>=0;i--)if(ids.has(foods[i].owner))foods.splice(i,1);for(const c of h.changes){const s=state.students.find(s=>s.id===c.id);if(s){s.points=c.before;if(c.beforeMeta)Object.assign(s,studentMeta(c.beforeMeta,c.before));}}if(h.reefBefore)state.game.reef=reefMeta(h.reefBefore);if(h.limitedBefore)restoreLimitedUndo(h.limitedBefore);save();render();$('evolutionBanner').classList.remove('show');toast('Undone: '+h.label);}
function showCelebration(title,detail,symbol='✧'){clearTimeout(bannerTimer);$('evolutionBanner').innerHTML=`<span class="evolution-icon">${symbol}</span><strong>${esc(title)}</strong><p>${esc(detail)}</p>`;$('evolutionBanner').classList.add('show');bannerTimer=setTimeout(()=>$('evolutionBanner').classList.remove('show'),3100);}
function announceEvolution(s,st){showCelebration(s.name+' evolved!',evolutionName(s,st)+' · still growing',STAGES[st].symbol);}
function completeMission(id,studentId){const m=state.game.missions.find(m=>m.id===id),s=state.students.find(s=>s.id===studentId);if(!m||!s)return;ensureStudent(s);if(s.completed[m.id]===localDay()){toast('This mission is already complete today.');return;}selectedId=s.id;reward([s.id],m.points,{mission:m.id,category:m.category,label:s.name+': '+m.title});openGameDialog('missions',s.id);}
function purchaseItem(id,studentId){const item=SHOP_ITEMS.find(i=>i.id===id),s=state.students.find(s=>s.id===studentId);if(!item||!s)return;ensureStudent(s);const beforeMeta=captureMeta(s),reefBefore=JSON.parse(JSON.stringify(state.game.reef)),owned=item.scope==='fish'?s.owned:state.game.reef.owned;
 if(!owned.includes(id)){if(s.shells<item.cost){toast(`Earn ${item.cost-s.shells} more shells for ${item.name.toLowerCase()}.`);return;}s.shells-=item.cost;owned.push(id);}
 if(item.scope==='fish')s.equipped=s.equipped===id?'none':id;else{const active=state.game.reef.active;state.game.reef.active=active.includes(id)?active.filter(x=>x!==id):[...active,id];}

function centennialPowerPose(f,p,room){
 const a=p*Math.PI*2,bell=Math.sin(Math.PI*p),rx=room.rx,ry=room.ry;
 let x=0,y=0,roll=0,tilt=0;
 switch(f.style){
  case 'spiral':x=Math.sin(a)*rx*.5;y=-bell*ry*.8;roll=a;break;
  case 'leap':x=Math.sin(a)*rx*.7;y=-bell*ry;tilt=Math.sin(a)*.5;break;
  case 'orbit':x=Math.sin(a)*rx*.85;y=(Math.cos(a)-1)*ry*.45;tilt=Math.sin(a)*.4;break;
  case 'sway':x=Math.sin(a)*rx*.45;y=Math.sin(a*2)*ry*.65;tilt=Math.sin(a*2)*.3;break;
  case 'dash':x=Math.sin(a)*Math.sin(Math.PI*p)*rx;y=-bell*ry*.2;tilt=Math.sin(a)*.12;break;
  case 'corkscrew':x=Math.sin(a)*rx*.8;y=Math.sin(a*2)*ry*.5;roll=Math.sin(a)*.65;break;
  case 'hover':y=-bell*ry*.35;tilt=Math.sin(a)*.08;break;
  case 'bloom':x=Math.sin(a)*rx*.2;y=-bell*ry*.55;roll=-a;break;
  case 'vortex':x=Math.sin(a*2)*rx*.65*bell;y=Math.sin(a)*ry*.5;tilt=Math.sin(a*2)*.5;break;
  case 'eclipse':x=Math.sin(a)*rx*.6;y=-bell*ry*.6;roll=Math.sin(a)*.4;break;
  case 'sunburst':y=-bell*ry*.65;roll=a*(p*p*(3-2*p));break;
  case 'halo':x=Math.sin(a)*rx*.15;y=-bell*ry*.9;tilt=-Math.sin(a)*.16;break;
  case 'planet':x=Math.sin(a)*rx;y=(Math.cos(a)-1)*ry*.4;tilt=Math.sin(a)*.35;break;
  case 'nebula':x=Math.sin(a)*rx*.65;y=Math.sin(a*2)*ry*.8;tilt=Math.cos(a)*bell*.35;break;
  case 'boost':x=Math.sin(a)*rx*.9;y=-bell*ry*.15;roll=Math.sin(a*2)*.1;break;
  case 'prism':x=Math.sin(a)*rx*.4;y=Math.sin(a*2)*ry*.35;roll=-a;break;
  case 'crown':x=Math.sin(a)*rx*.6;y=Math.sin(a)*ry*.25;tilt=Math.sin(a*2)*.18;break;
  case 'pearls':x=Math.sin(a)*rx*.35;y=Math.sin(a*2)*ry*.45;roll=Math.sin(a)*.32;break;
  case 'breach':x=Math.sin(a)*rx*.8;y=-bell*ry;tilt=-Math.sin(a)*.6;break;
  case 'ribbon':x=Math.sin(a)*rx*.9;y=Math.sin(a*2)*ry*.55;tilt=Math.sin(a*2)*.48;break;
 }
 return {x,y,roll,tilt};
}

function exportCSV(withPoints){const safe=v=>{let str=String(v);if(typeof v!=='number'&&/^[=+@\-\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';};const rows=[['name','type','color','feeds'],...state.students.map(s=>[s.name,FAMILIES[s.family].name,PALETTES[s.color].name,withPoints?s.points:0])];downloadText('\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n'),'Reef_Students_'+(withPoints?'With_Points':'Fresh_Start')+'.csv','text/csv;charset=utf-8');toast('Student list downloaded.');}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(ch===','&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(c=>c.trim()))rows.push(row);row=[];cell='';}else cell+=ch;}if(quoted)throw Error('The CSV has an unclosed quotation mark.');row.push(cell);if(row.some(c=>c.trim()))rows.push(row);return rows;}
async function importCSV(file){if(!file)return;try{if(file.size>300000)throw Error('Please use a CSV file under 300 KB.');const rows=parseCSV(await file.text());if(!rows.length)throw Error('This CSV has no student names.');const header=rows[0].map(s=>s.trim().toLowerCase()),hasHeader=header.includes('name')||header.includes('student');let nameCol=hasHeader?Math.max(header.indexOf('name'),header.indexOf('student')):0,pointsCol=hasHeader?Math.max(header.indexOf('feeds'),header.indexOf('points')):-1,typeCol=hasHeader?header.indexOf('type'):-1,colorCol=hasHeader?header.indexOf('color'):-1;const entries=(hasHeader?rows.slice(1):rows).filter(r=>r[nameCol]?.trim());if(!entries.length||entries.length>80)throw Error('Choose a list with 1 to 80 students.');const students=entries.map((r,i)=>{const num=pointsCol<0?0:Number(r[pointsCol]||0);if(!Number.isFinite(num)||num<-99999||num>99999)throw Error('The points column must contain numbers from −99,999 to 99,999.');const f=FAMILIES.findIndex(f=>f.name.toLowerCase()===(r[typeCol]||'').trim().toLowerCase()),p=PALETTES.findIndex(p=>p.name.toLowerCase()===(r[colorCol]||'').trim().toLowerCase());let name=r[nameCol].trim();if(/^'[=+@\-\t\r]/.test(name))name=name.slice(1);return {id:uid(),name:name.slice(0,50),points:Math.floor(num),family:f<0?i%3:f,color:p<0?i%6:p};});pendingImport={version:1,title:state.title,demo:false,settings:{...state.settings},students,history:[]};openDialog('restore');}catch(e){toast(e.message||'The CSV could not be opened.');}}
async function importBackground(file){if(!file||!settingsDraft)return;const targetTheme=uploadTheme;try{if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP image.');if(file.size>15*1024*1024)throw Error('Please use an image under 15 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(!$('settingsTitle'))return;const ratio=Math.min(1,1400/img.width,900/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);settingsDraft[targetTheme==='day'?'customDay':'customNight']=c.toDataURL('image/jpeg',.78);settingsDraft[targetTheme+'Background']='custom';markBackgroundChoice(targetTheme,'custom');$(targetTheme+'UploadHint').textContent='Image ready · Save settings to apply';}finally{URL.revokeObjectURL(url);}}catch(e){toast(e.message||'The image could not be opened.');}}

function seeded(seed){let v=seed>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296;};}

const activeChases=[],chaseRoles=new Map();let nextChaseCheck=2.4;
function canPlayChase(hunter,runner){return hunter.id!==runner.id&&hunter.points>=runner.points+3;}

function chaseMargin(s,w){return Math.min(sceneW*.45,Math.max(43,fishGeometry(s).width*.61*w.scale));}
function finishChase(pair,time,bitten=false){
 const h=swimmers.get(pair.hunter),r=swimmers.get(pair.runner);if(h){h.playCooldown=time+12+h.seed*9;h.chaseUntil=0;}
 if(r){r.playCooldown=time+10+r.seed*7;if(bitten){r.escapeUntil=time+2.2;r.escapeDir=h?(r.x>=h.x?1:-1):r.dir;r.escapeY=Math.sin(r.phase)*.5;}}

}
function updatePlayfulChases(dt,time){

 const byId=new Map(state.students.map(s=>[s.id,s])),feeding=new Set(foods.filter(f=>!f.eaten).map(f=>f.owner));
 for(const pair of [...activeChases]){
  const hs=byId.get(pair.hunter),rs=byId.get(pair.runner),h=swimmers.get(pair.hunter),r=swimmers.get(pair.runner);
  if(!hs||!rs||!h||!r||h.trick||r.trick||!canPlayChase(hs,rs)||feeding.has(pair.hunter)||feeding.has(pair.runner)||time>pair.until){finishChase(pair,time);continue;}
  const mouthX=h.x+h.dir*mouthDistance(hs,h),mouthY=h.y+mouthYOffset(hs)*h.scale,runnerRadius=fishGeometry(rs).width*r.scale*.27;
  if(time-pair.start>.3&&Math.hypot(mouthX-r.x,mouthY-r.y)<Math.max(15,runnerRadius+10)){
   h.nibbleUntil=time+.55;h.chew=.7;h.pulse=1.4;r.pulse=.7;showComicBones(r);
   emit(mouthX,mouthY,fishVisualPalette(hs).glow,12);
   floaters.push({x:(mouthX+r.x)/2,y:r.y,text:'Nibble! ♡',life:1.1,color:'#d8fff2'});
   finishChase(pair,time,true);
  }
 }
 if(time>=nextChaseCheck&&sceneW>240){
  nextChaseCheck=time+2.2;
  const busy=new Set(activeChases.flatMap(p=>[p.hunter,p.runner])),limit=Math.min(4,Math.max(1,Math.floor(state.students.length/5)));
  if(activeChases.length<limit){
   const candidates=[];
   for(const hunter of state.students){const h=swimmers.get(hunter.id);if(!h||h.trick||busy.has(hunter.id)||feeding.has(hunter.id)||(h.playCooldown||0)>time)continue;
    for(const runner of state.students){const r=swimmers.get(runner.id);if(!r||r.trick||!canPlayChase(hunter,runner)||busy.has(runner.id)||feeding.has(runner.id)||(r.playCooldown||0)>time)continue;
     if(state.settings.zone&&topIds.has(hunter.id)!==topIds.has(runner.id))continue;
     const distance=Math.hypot(h.x-r.x,h.y-r.y);if(distance<sceneW*.72)candidates.push({hunter:hunter.id,runner:runner.id,distance:distance+Math.random()*70});
    }
   }
   candidates.sort((a,b)=>a.distance-b.distance);

  }
 }

}

function drumBus(volume=state.game.showtime.drumVolume){

 if(!Number.isFinite(t.x))t.x=w.x;if(!Number.isFinite(t.y))t.y=w.y;
}
function mysteryPopupHTML(s){
 return `<button class="mystery-dismiss" data-action="mysteryDismiss" aria-label="Dismiss Mystery Diver result">×</button><span class="mystery-eyebrow">✦ YOUR MYSTERY DIVER</span><strong id="mysteryWinnerName" class="mystery-winner-name">${esc(s.name)}</strong><span class="mystery-fish-points">${s.points.toLocaleString()} points · ${esc(mysteryResult.scope||'Whole class')}</span><div class="mystery-fish-stage"><canvas id="mysteryFishPortrait" width="800" height="380" aria-label="${esc(s.name)}’s ${esc(fishTypeName(s))}"></canvas><span class="mystery-fish-edition">${FORMS[effectiveForm(s)].limited?'LIMITED · 1/1':esc(fishTypeName(s))}</span></div><div class="mystery-result-actions"><button data-action="mysteryPick">Pick next</button><button class="primary" data-action="award" data-id="${esc(s.id)}" data-amount="1" aria-label="Participation point for ${esc(s.name)}">Participation +1</button></div>${!state.settings.sound?'<button class="mystery-enable-sound" data-action="enableMysterySound">♫ Enable drum sounds</button>':''}`;
}
function paintMysteryPopup(now=Date.now()){
 const overlay=$('mysteryOverlay');if(!overlay)return;
 const visible=!!mysteryRun||!!mysteryResult;overlay.hidden=!visible;
 overlay.classList.toggle('is-revealed',!!mysteryResult&&!mysteryRun);
 if(!visible){overlay.removeAttribute?.('aria-labelledby');return;}
 if(mysteryRun){
  const s=state.students.find(s=>s.id===mysteryRun.highlight),name=s?.name||'Who will it be?';
  workflowHTML('mysteryOverlay',`<span class="mystery-eyebrow">✦ MYSTERY DIVER · ${esc(pickerScopeName(mysteryRun.scope))}</span><strong>${esc(name)}</strong><span class="mystery-hint">Drumroll… your diver appears in a moment.</span>`);
 }else{
  const s=state.students.find(s=>s.id===mysteryResult.id);if(!s){mysteryResult=null;overlay.hidden=true;return;}
  overlay.setAttribute('role','dialog');overlay.setAttribute('aria-labelledby','mysteryWinnerName');overlay.setAttribute('aria-live','assertive');

  overlay.style.setProperty('--reveal-x','0px');overlay.style.setProperty('--reveal-y','0px');

function renderEffectsHUD(now=Date.now()){
 const rows=[];for(const s of state.students){const w=swimmers.get(s.id);if(!w)continue;
  if(w.trick)rows.push({id:s.id,name:s.name,effect:w.trick.customName||FISH_TRICKS[w.trick.key].name,seconds:Math.max(.1,w.trick.duration-w.trick.elapsed),kind:'trick'});
  if((w.boneUntil||0)>now)rows.push({id:s.id,name:s.name,effect:'Comic X-ray',seconds:(w.boneUntil-now)/1000,kind:'bones'});
 }
 const box=$('effectsHUD');if(!box)return;box.hidden=!rows.length;
 const html=rows.slice(0,3).map(r=>`<span class="live-effect-tag" data-effect="${r.kind}"><b>${esc(r.name)}</b> · ${esc(r.effect)} <small>${r.seconds.toFixed(1)}s</small></span>`).join('');
 if(lastEffectsHUD!==html){lastEffectsHUD=html;box.innerHTML=html;}
}
function drawFishPerformance(c,s,w){
 c.save();try{
  if(boneEffectActive(w,Date.now()))drawFishBones(c,s,w,clock+w.phase);
  else drawFish(c,s,w.x,w.y,w.scale*(w.trickDrawScale||1),(Math.sign(w.facing)||w.dir)*Math.max(.18,Math.abs(w.facing)),clock+w.phase,w.pulse,false,w.tilt+(w.trickRoll||0),w.chew,Math.max(0,(w.nibbleUntil||0)-clock));
 }catch(e){
  if(!effectFrameErrorReported){console.error('Fish artwork could not be drawn:',e);effectFrameErrorReported=true;}
  ellipse(c,w.x,w.y,Math.max(8,22*w.scale),Math.max(6,15*w.scale),fishVisualPalette(s).body);
 }finally{c.restore();}
}

 }};

 const oldAction=action;action=async function(el){

   const s=state.students.find(s=>s.id===el.dataset.id),w=swimmers.get(s?.id);if(!s||!w)return;
   // A teacher-triggered preview is a static swap and also works in Gentle mode.

  }
  await oldAction(el);
 };
 const drawFrame=frame;frame=function(now){
  try{drawFrame(now);}catch(e){
   if(!effectFrameErrorReported){console.error('Aquarium drawing was interrupted:',e);effectFrameErrorReported=true;}
   requestAnimationFrame(frame);
  }
 };
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastFrame=performance.now();if(mysteryRun&&Date.now()>=mysteryRun.end)finishMysteryDiver();}});
}

// The update entry lives in the game itself, including classroom fullscreen.
function setGameUpdateReady(version){
 for(const id of ['gameUpdateButton','tankUpdateButton']){
  const button=$(id);if(!button)continue;
  button.textContent=version?'↻ Update ready':'↻ Update game';
  button.setAttribute('data-update-state',version?'available':'ready');
  button.setAttribute('aria-label',version?'Update game: version '+version+' available':'Update game');
  button.title=version?'Version '+version+' is ready to install':'Check for game updates';
 }
}
async function openGameUpdates(){
 if(aquariumFullscreen)await toggleAquariumFullscreen();
 if(window.reefDesktop?.isDesktop){
  try{await window.reefDesktop.openUpdates();}catch{toast('The update window could not open. Your game is still saved.');}
  return;
 }
 preview.innerHTML=dialogShell('Game updates','Your aquarium keeps working offline.',
  '<div class="game-update-info"><span class="update-mark">↻</span><h3>Updates inside the Windows game.</h3><p>Open Reef Rewards for Windows to check and install updates here. Your class, points, and limited fish stay saved.</p><a class="game-download-link" href="https://github.com/ebaneymar/ReefReward/releases/latest" target="_blank" rel="noopener noreferrer">Get the Windows game ↗</a><p class="muted">Moving from this HTML file? Use Settings → Export backup, then Restore backup in the Windows game once.</p></div>',
  '<button data-action="close">Back to my reef</button>');
 preview.showModal();
}
function installGameUpdatesUI(){

 setGameUpdateReady();
 window.reefDesktop?.onProgress?.(progress=>{if(progress.stage==='available')setGameUpdateReady(progress.version);});
}
